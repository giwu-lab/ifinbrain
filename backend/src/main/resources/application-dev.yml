spring:
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:./data/ifinbrain.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: 'PRAGMA foreign_keys = ON'
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true                          # 现有业务 sys_* 表由 Flyway 管理（SQLite）