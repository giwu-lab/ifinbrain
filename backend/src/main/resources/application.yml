spring:
  profiles:
    active: dev
  application:
    name: ifinbrain
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB
  # 项目默认时区：上海 (UTC+8)。与 dev.sh 里 TZ=Asia/Shanghai、iFinBrainApplication 启动时
  # TimeZone.setDefault 共同保证：JVM 默认、Hibernate JDBC、Jackson JSON 三处一致。
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  # Spring AI 2.0 的模型自动配置一律是 matchIfMissing=true —— 属性「缺失」等于「启用」，
  # 而 OpenAI 的任一模型在拿不到 api-key 时会从 OpenAiSetup#buildClientOptions 直接抛
  # IllegalStateException 并终止整个应用上下文（不只少一个 bean）。
  # 所以这里默认逐项显式关闭，需要哪个模型就在对应 profile 里打开哪个。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    uri-encoding: UTF-8
    relaxed-query-chars: '[,]'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ifinbrain:
  jwt:
    # 无内置默认值：硬编码兜底密钥会随源码泄露，任何人可据此伪造合法 token。
    # 启动期由 JwtUtil.init() 强校验，未配置或长度 < 32 字节直接失败。
    # 生成：openssl rand -base64 48
    access-secret: ${JWT_ACCESS_SECRET}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8088
  # 识别 API 配置（base-url / api-key / timeout）必须到 系统 → API 设置 中配置，
  # 存储在 sys_setting 表的 ocr.* key，由 FapiaoCnClient 直接读取， 无 yaml 字段绑定。
  storage:
    type: local
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:./data/storage}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: true
  security:
    master-key: ${IFINBRAIN_MASTER_KEY:}
    # 迁移期开关：true = CryptoUtil.decrypt() 接受非 v1: 前缀的明文值（旧数据迁移用）；
    #            false = 非 v1: 前缀抛 BizException(500) —— 任何漏 encrypt 的写入路径会立刻爆。
    # 迁移完成后务必改为 false —— review M17。
    allow-legacy-plaintext: ${IFINBRAIN_ALLOW_LEGACY_PLAINTEXT:true}

  # 数据导入（Excel / CSV → 外部数据源表）
  import:
    # 单文件上限。刻意不动上面的 spring.servlet.multipart.max-file-size（100MB 是发票上传用的）——
    # 导入的解析会把整个 sheet 读进堆内存，20MB xlsx 展开后约占百 MB。
    max-file-size: 20MB
    # 数据行上限。超了直接拒收并置 truncated，不做「先读进来再截」。
    max-rows: 50000
    # 同时存在的预检会话数：解析结果缓存在堆里，这是防并发叠加的第二道闸。
    max-sessions: 20
    # 会话闲置多久失效（用户中途去干别的事回来发现要重传）
    session-ttl: 30m
    # executeBatch 粒度；请求里传的值会被夹到 [200, 2000]
    batch-size: 1000
    # 单条 INSERT 语句的 JDBC 超时
    query-timeout-sec: 120
    # 预检返回给前端的样例行数
    preview-rows: 20
    # 错误明细最多回传 / 落库条数（超出只留计数，避免几千条明细把前端表格卡死）
    max-error-rows: 200