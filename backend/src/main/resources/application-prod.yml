spring:
  application:
    name: fapiao-web
  datasource:
    url: jdbc:postgresql://${PG_HOST:}:${PG_PORT:5432}/${PG_DB:fapiao_web}${PG_QUERY_STRING:}
    username: ${PG_USER:}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: fapiao-pool
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true