name: ifinbrain

# 仅用于生产部署（prod 模式）。dev 模式请用源码启动：
#   backend : mvn -DskipTests spring-boot:run
#   frontend: npm run dev
# 详见 README 的「dev 模式」章节。
#
# 默认模式：PostgreSQL + 本地磁盘存储。SQLite 已弃用，必须提供 PG_* 环境变量
# （PG_HOST / PG_PORT / PG_DB / PG_USER / PG_PASSWORD），缺一个连不上就启动失败。
# compose 里不再内置 PG 服务 —— 库由运维提供（需装 pgvector 扩展）。

services:
  backend:
    build: ./backend
    image: ifinbrain-backend:latest
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_STORAGE_LOCAL_ROOT: /app/data/storage
    volumes:
      - backend_data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: ifinbrain-frontend:latest
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  backend_data: